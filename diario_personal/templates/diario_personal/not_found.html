<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Página no encontrada | Diario personal</title>
	<style>
		:root {
			--paper: #fff8ed;
			--ink: #3f3028;
			--accent: #7f3f2a;
			--accent-light: #f1c7a9;
		}

		* {
			box-sizing: border-box;
		}

		body {
			align-items: center;
			background: linear-gradient(135deg, #f7dfc8, var(--paper));
			color: var(--ink);
			display: flex;
			font-family: Georgia, 'Times New Roman', serif;
			justify-content: center;
			margin: 0;
			min-height: 100vh;
			padding: 24px;
		}

		main {
			background: rgba(255, 248, 237, 0.92);
			border-left: 6px solid var(--accent);
			border-radius: 8px;
			box-shadow: 0 14px 35px rgba(96, 55, 35, 0.16);
			max-width: 620px;
			padding: 48px 56px;
			text-align: center;
			width: 100%;
		}

		.status-code {
			color: var(--accent-light);
			font-size: 1rem;
			font-weight: bold;
			letter-spacing: 0.12em;
			margin: 0 0 12px;
		}

		h1 {
			color: var(--accent);
			font-size: clamp(1.8rem, 5vw, 3rem);
			margin: 0 0 12px;
		}

		p {
			font-size: 1.1rem;
			margin: 0 0 28px;
		}

		a {
			background: var(--accent);
			border-radius: 4px;
			color: var(--paper);
			display: inline-block;
			padding: 10px 18px;
			text-decoration: none;
		}

		a:hover {
			background: #653020;
		}

		@media (max-width: 480px) {
			main {
				padding: 38px 24px;
			}
		}
	</style>
</head>
<body>
	<main>
		<p class="status-code">ERROR 404</p>
		<h1>Página no encontrada</h1>
		<p>El endpoint que buscas no existe en tu diario personal.</p>
		<a href="/">Volver al inicio</a>
	</main>
</body>
</html>
