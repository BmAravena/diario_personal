<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario personal</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #fff8ed;
            --ink: #3f3028;
            --accent: #7f3f2a;
            --accent-light: #f1c7a9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: linear-gradient(135deg, #f7dfc8, var(--paper));
            color: var(--ink);
            display: flex;
            font-family: Georgia, 'Times New Roman', serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: rgba(255, 248, 237, 0.9);
            border-left: 6px solid var(--accent);
            border-radius: 8px;
            box-shadow: 0 14px 35px rgba(96, 55, 35, 0.16);
            max-width: 620px;
            padding: 56px 64px;
            text-align: center;
            width: 100%;
        }

        h1 {
            color: var(--accent);
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 700;
            margin: 0;
        }

        h1::after {
            background: var(--accent-light);
            content: '';
            display: block;
            height: 4px;
            margin: 20px auto 0;
            width: 72px;
        }

        @media (max-width: 480px) {
            main {
                padding: 42px 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Diario personal</h1>
    </main>
</body>
</html>
