{% extends 'diario_personal/base.html' %}

{% block title %}Detalle de categoría | Diario personal{% endblock %}

{% block content %}
    <section class="w-100 card border-primary shadow-sm category-list-card">
        <div class="card-header bg-primary text-white">
            <h1 class="h3 mb-0">Detalle de categoría</h1>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Nombre</dt>
                <dd class="col-sm-9">{{ categoria.nombre }}</dd>

                <dt class="col-sm-3">Descripción</dt>
                <dd class="col-sm-9">{{ categoria.descripcion|default:"—"|linebreaksbr }}</dd>
            </dl>

            <div class="mt-3">
                <a href="{% url 'edit_categoria' categoria.pk %}" class="btn btn-primary">Editar</a>
                <a href="{% url 'listado_categorias' %}" class="btn btn-outline-primary ms-2">Volver</a>
            </div>
        </div>
    </section>
{% endblock %}
