<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Diario personal{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #fff8ed;
            --ink: #3f3028;
            --accent: #7f3f2a;
            --accent-light: #f1c7a9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f7dfc8, var(--paper));
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            margin: 0;
            min-height: 100vh;
            padding: 0 24px 24px;
        }

        nav {
            background: rgba(255, 248, 237, 0.88);
            border-bottom: 2px solid var(--accent-light);
            box-shadow: 0 4px 14px rgba(96, 55, 35, 0.08);
            margin: 0 -24px 32px;
            padding: 10px 24px;
        }   

        .nav-inner {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin: 0 auto;
            max-width: 1100px;
        }

        nav a {
            color: var(--accent);
            text-decoration: none;
        }

        .brand {
            align-items: center;
            display: inline-flex;
            font-size: 1.15rem;
            font-weight: bold;
            gap: 8px;
        }

        .nav-link {
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 0.95rem;
            padding: 6px 13px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent-light);
        }

        .nav-link:hover {
            background: var(--accent);
            color: var(--paper);
        }

        .nav-icon {
            font-size: 1.35rem;
            line-height: 1;
        }

        main {
            align-items: center;
            display: flex;
            justify-content: center;
            min-height: calc(100vh - 84px);
        }

        .page-content {
            background: rgba(255, 248, 237, 0.92);
            border-left: 6px solid var(--accent);
            border-radius: 8px;
            box-shadow: 0 14px 35px rgba(96, 55, 35, 0.16);
            max-width: 620px;
            padding: 48px 56px;
            text-align: center;
            width: 100%;
        }

        h1 {
            color: var(--accent);
            font-size: clamp(1.8rem, 5vw, 3rem);
            margin: 0;
        }

        h1::after {
            background: var(--accent-light);
            content: '';
            display: block;
            height: 4px;
            margin: 20px auto 0;
            width: 72px;
        }

        .status-code {
            color: var(--accent-light);
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            margin: 0 0 12px;
        }

        .message {
            font-size: 1.1rem;
            margin: 0 0 28px;
        }

        .button {
            background: var(--accent);
            border-radius: 4px;
            color: var(--paper);
            display: inline-block;
            padding: 10px 18px;
            text-decoration: none;
        }

        .button:hover {
            background: #653020;
        }

        @media (max-width: 480px) {
            body {
                padding: 0 18px 18px;
            }

            nav {
                margin-left: -18px;
                margin-right: -18px;
                padding-left: 18px;
                padding-right: 18px;
            }

            .brand {
                font-size: 1.1rem;
            }

            .page-content {
                padding: 38px 24px;
            }
        }
    </style>
</head>
<body>
    <nav aria-label="Navegación principal">
        <div class="nav-inner">
            <a class="brand" href="/">
                <span class="nav-icon" aria-hidden="true">&#128211;</span>
                Diario personal
            </a>
            <a class="nav-link" href="/">Inicio</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
