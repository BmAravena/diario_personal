{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Diario personal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}?v=brite-20261022-2">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}?v=brite-20261022-2">
    <link rel="icon" type="image/png" href="{% static 'images/icon.png' %}?v=1">
    
</head>
<body>
    <nav class="navbar navbar-expand-md bg-primary app-nav" aria-label="Navegación principal">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                <span aria-hidden="true">&#128211;</span>
                Diario personal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="menuPrincipal">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Inicio</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container app-main py-5">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
</body>
</html>
